name: Auto-update projects in README

# Refreshes the "More Projects" block from my repos so new work appears
# automatically. Runs daily and on demand; commits only when something changed.
on:
  schedule:
    - cron: "0 8 * * *"   # daily ~1am America/Phoenix
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/update_projects.py"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate project list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_projects.py
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: auto-update project list"
            git push
          else
            echo "No README changes."
          fi
